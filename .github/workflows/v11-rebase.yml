name: Memories 11.0.2 upstream rebase baseline
on:
  push:
    paths:
      - 'go-vod-v11/**'
      - 'memories_rkmpp_v11/**'
      - 'scripts/deploy-v11.sh'
      - '.github/workflows/v11-rebase.yml'
  pull_request:
    paths:
      - 'go-vod-v11/**'
      - 'memories_rkmpp_v11/**'
      - 'scripts/deploy-v11.sh'
      - '.github/workflows/v11-rebase.yml'
permissions:
  contents: read
jobs:
  upstream-v11:
    name: Go 0.7.0 baseline (not RKMPP)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go-vod-v11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-vod-v11/go.mod
          cache-dependency-path: go-vod-v11/go.sum
      - name: Assert upstream protocol
        run: grep -F 'const VERSION = "0.7.0"' main.go
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          go build ./...
      - name: Check Go formatting
        run: |
          gofmt -d cmd/rkmpp-smoke/main.go cmd/rkmpp-smoke/main_test.go
          gofmt -l .
          test -z "$(gofmt -l .)"
      - name: Native player and deployment checks
        working-directory: .
        run: |
          node --test memories_rkmpp_v11/js/player.test.cjs
          sh -n scripts/deploy-v11.sh
          find memories_rkmpp_v11 -name '*.php' -print0 | xargs -0 -n1 php -l
