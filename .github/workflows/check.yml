name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Go formatting, race tests, vet, and build
        run: docker build --target build -f go-vod/Dockerfile.rkmpp go-vod
      - name: Player regression tests
        run: node --test memories_rkmpp_player/js/*.test.cjs
      - name: Connection-test contract checks
        run: docker run --rm -v "$PWD:/source:ro" php:8.3-cli php /source/memories_rkmpp_player/tests/connection_test.php
      - name: Bundled deployment checks
        run: |
          sh -n scripts/build-release.sh scripts/update-nextcloud-player.sh scripts/deploy.sh
          node --test scripts/packaging.test.cjs
          docker run --rm -v "$PWD:/source:ro" php:8.3-cli php -l /source/scripts/nextcloud-player-control.php
