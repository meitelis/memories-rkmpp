name: Source checks
on:
  push:
    paths: ['README.md', 'docs/**', 'go-vod/**', 'memories_rkmpp_v11/**', 'tests/**', 'package*.json', 'scripts/**', 'compose.yml', '.env.example', '.github/workflows/check.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'go-vod/**', 'memories_rkmpp_v11/**', 'tests/**', 'package*.json', 'scripts/**', 'compose.yml', '.env.example', '.github/workflows/check.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go-vod/go.mod
          cache-dependency-path: go-vod/go.sum
      - name: Protocol, formatting, race tests, vet and build
        working-directory: go-vod
        run: |
          grep -F 'const VERSION = "0.7.0"' main.go
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Browser and deployment checks
        run: |
          npm ci --ignore-scripts
          npm test
          sh -n scripts/build-v11.sh scripts/install-player-v11.sh scripts/deploy-v11.sh scripts/test-v11-deploy-preflight.sh
          sh scripts/test-v11-deploy-preflight.sh
          bash -n scripts/test-v11-rkmpp.sh scripts/test-v11-network.sh
          find memories_rkmpp_v11 -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/test-v11-compat.php
          php scripts/test-v11-compat.php
          docker compose -f compose.yml config --quiet
