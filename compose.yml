services:
  memories-rkmpp:
    image: local/memories-rkmpp:memories-11.0.2-govod-0.7.0-r2
    pull_policy: never
    container_name: memories-rkmpp
    init: true
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["0", "${VIDEO_GID:-44}", "${RENDER_GID:-993}"]
    environment:
      NEXTCLOUD_HOST: ${NEXTCLOUD_HOST:-http://nextcloud}
      MEMORIES_RKMPP: "1"
      MEMORIES_RKMPP_STRICT: "true"
      MEMORIES_RKMPP_CODEC: ${MEMORIES_RKMPP_CODEC:-auto}
      MEMORIES_RKMPP_OPENCL: "true"
      GO_VOD_BRIDGE_ENABLED: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - systempaths=unconfined
    pids_limit: 512
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
      - /dev/dri:/dev/dri
      - /dev/mali0:/dev/mali0
    volumes:
      - cache:/cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [nextcloud]
networks:
  nextcloud:
    external: true
    name: ${NEXTCLOUD_NETWORK:-nextcloud_stack_nextcloud_network}
volumes:
  cache:
    external: true
    name: memories-rkmpp-v11-cache
